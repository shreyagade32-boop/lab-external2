<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Toys Store</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { font-family: Verdana, Arial, sans-serif; background: #f1f8ff; margin: 0; }
        .container { max-width: 900px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 10px #bcdffb; }
        header { text-align: center; margin-bottom: 20px; }
        h1 { color: #2980b9; margin-bottom: 0; }
        .toy-list { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; }
        .toy-item { background: #eaf6fd; border: 1px solid #d2eaf6; border-radius: 8px; width: 220px; padding: 16px; text-align: center; }
        .toy-item img { width: 120px; height: 120px; object-fit: cover; border-radius: 8px; }
        .toy-item h2 { font-size: 18px; margin: 10px 0 8px; color: #166388; }
        .toy-item p { font-size: 15px; color: #7f8fa6; }
        .toy-item .price { font-weight: bold; color: #27ae60; margin-bottom: 8px; }
        .toy-item button { background: #2980b9; color: #fff; border: none; border-radius: 5px; padding: 8px 16px; cursor: pointer; }
        .toy-item button:hover { background: #166388; }
        #cart { margin-top: 32px; }
        #cart h2 { margin-bottom: 10px; }
        #cart-list { list-style: none; padding: 0; }
        #cart-list li { padding: 6px 0; border-bottom: 1px solid #d2eaf6; }
        #total { font-weight: bold; margin-top: 10px; color: #27ae60;}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Toys Store</h1>
            <p>Fun and exciting toys for all ages!</p>
        </header>
        <section class="toy-list" id="toy-list">
            <!-- Toys will be rendered here -->
        </section>
        <section id="cart">
            <h2>Your Cart</h2>
            <ul id="cart-list"></ul>
            <span id="total"></span>
        </section>
    </div>
    <script>
        // Sample toy items
        const toys = [
            { id: 1, name: "Building Blocks", price: 12.99, image: "https://via.placeholder.com/120?text=Blocks", desc: "Colorful blocks for creative building." },
            { id: 2, name: "Remote Car", price: 29.49, image: "https://via.placeholder.com/120?text=Remote+Car", desc: "Fast remote controlled car." },
            { id: 3, name: "Teddy Bear", price: 15.99, image: "https://via.placeholder.com/120?text=Teddy+Bear", desc: "Soft and cuddly teddy bear." },
            { id: 4, name: "Puzzle Cube", price: 7.99, image: "https://via.placeholder.com/120?text=Puzzle+Cube", desc: "Classic brain-teasing puzzle cube." },
            { id: 5, name: "Action Figure", price: 19.99, image: "https://via.placeholder.com/120?text=Action+Figure", desc: "Superhero action figure for adventures." }
        ];

        const cart = [];
        function renderToys() {
            const toyList = document.getElementById('toy-list');
            toyList.innerHTML = '';
            toys.forEach(toy => {
                const div = document.createElement('div');
                div.className = 'toy-item';
                div.innerHTML = `
                    <img src="${toy.image}" alt="${toy.name}">
                    <h2>${toy.name}</h2>
                    <div class="price">$${toy.price.toFixed(2)}</div>
                    <p>${toy.desc}</p>
                    <button onclick="addToCart(${toy.id})">Add to Cart</button>
                `;
                toyList.appendChild(div);
            });
        }

        function addToCart(toyId) {
            const toy = toys.find(t => t.id === toyId);
            const cartItem = cart.find(c => c.toy.id === toyId);
            if (cartItem) {
                cartItem.qty += 1;
            } else {
                cart.push({ toy, qty: 1 });
            }
            renderCart();
        }

        function renderCart() {
            const cartList = document.getElementById('cart-list');
            cartList.innerHTML = '';
            let total = 0;
            cart.forEach(c => {
                total += c.toy.price * c.qty;
                const li = document.createElement('li');
                li.textContent = `${c.toy.name} x${c.qty} - $${(c.toy.price * c.qty).toFixed(2)}`;
                cartList.appendChild(li);
            });
            document.getElementById('total').textContent = total ? `Total: $${total.toFixed(2)}` : '';
        }

        renderToys();
        renderCart();
    </script>
</body>
</html>
